name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  harness-pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce controlled rerun policy
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 3 ]; then
            echo "Blocked: third CI rerun without approval (max 2 controlled reruns)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Validate docs
        run: pnpm exec harness validate-docs

      - name: Harness check full
        run: pnpm exec harness check --full

      - name: Test
        run: pnpm test
