name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Validate docs
        run: pnpm exec harness validate-docs

      - name: Harness check full
        run: pnpm exec harness check --full

      - name: Test
        run: pnpm test
