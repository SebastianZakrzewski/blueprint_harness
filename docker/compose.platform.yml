services:
  platform-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harness_platform
      POSTGRES_PASSWORD: harness_platform
      POSTGRES_DB: harness_platform
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
